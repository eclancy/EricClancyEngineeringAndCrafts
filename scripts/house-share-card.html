<!doctype html>
<!-- The link-preview image for ecec.dev/house-share (public/house-share/preview.png).
     Re-render after changing it, from the repo root:
       chrome --headless=new --hide-scrollbars --window-size=1200,630 \
         --screenshot=public/house-share/preview.png scripts/house-share-card.html
     and bump the ?v= on og:image in public/house-share/index.html so previews refresh. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #24452f;
        color: #fbf6ec;
        font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 70px;
      }
      .eyebrow {
        display: inline-block;
        padding: 8px 20px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.12);
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        margin: 22px 0 0;
        font-family: 'Fraunces', Georgia, serif;
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -2px;
      }
      p {
        margin: 20px 0 0;
        font-size: 36px;
        opacity: 0.92;
      }
      .scene {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 1200px;
        height: 330px;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <span class="eyebrow">🏡 Big news</span>
      <h1>We bought a house!</h1>
      <p>Falmouth, Maine · fire pit nights ahead</p>
    </div>
    <svg class="scene" viewBox="0 0 800 220" preserveAspectRatio="xMidYMax slice">
      <defs>
        <radialGradient id="glow" cx="50%" cy="60%" r="50%">
          <stop offset="0" stop-color="#ffb070" stop-opacity="0.55" />
          <stop offset="1" stop-color="#ffb070" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle cx="690" cy="52" r="18" fill="#fbf1d6" opacity="0.9" />
      <g fill="#16301f">
        <path d="M40 220 L80 90 L120 220Z" />
        <path d="M95 220 L140 60 L185 220Z" />
        <path d="M600 220 L645 70 L690 220Z" />
        <path d="M660 220 L710 100 L760 220Z" />
        <path d="M730 220 L770 120 L810 220Z" />
      </g>
      <g>
        <path d="M250 120 L360 60 L470 120 Z" fill="#5a3b2e" />
        <rect x="268" y="118" width="184" height="102" fill="#e9dcc3" />
        <rect x="300" y="140" width="34" height="30" rx="2" fill="#ffd58a" />
        <rect x="386" y="140" width="34" height="30" rx="2" fill="#ffd58a" />
        <rect x="345" y="168" width="30" height="52" rx="2" fill="#24452f" />
        <rect x="420" y="72" width="16" height="30" fill="#5a3b2e" />
      </g>
      <ellipse cx="540" cy="200" rx="90" ry="40" fill="url(#glow)" />
      <ellipse cx="540" cy="208" rx="30" ry="8" fill="#6b625a" />
      <path
        d="M540 170 C528 188 530 202 540 206 C550 202 552 188 540 170Z"
        fill="#f08a52"
      />
      <path
        d="M540 184 C534 194 535 202 540 204 C545 202 546 194 540 184Z"
        fill="#ffd58a"
      />
      <rect x="0" y="214" width="800" height="6" fill="#16301f" />
    </svg>
  </body>
</html>
