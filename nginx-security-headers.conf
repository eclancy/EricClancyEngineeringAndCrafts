# Security headers for every response, included by nginx.conf at the server level and again in
# each location that sets an add_header of its own (nginx drops inherited add_headers there).
# The Dockerfile copies this to /etc/nginx/security-headers.conf.

# Browsers that have seen the site once use HTTPS for it for a year, even if a link says http.
add_header Strict-Transport-Security "max-age=31536000" always;
# Files are only ever what their Content-Type says they are.
add_header X-Content-Type-Options "nosniff" always;
# Other sites linked to see that a visitor came from ecec.dev, not which page.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No other site can show these pages inside a frame of its own.
add_header X-Frame-Options "SAMEORIGIN" always;
