<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020618" />
    <!-- share:start - the title, description, link-preview tags and structured data, filled in
         from src/data/seo.ts by scripts/game-pages.ts (which also writes each game page's copy
         of this file with its own). -->
    <!-- share:end -->
    <script>
      // Paint the page's own backdrop before the app's script arrives, so neither the home page
      // nor a game page flashes white first. Colours match each page (and GameLoader).
      ;(function () {
        var game = (location.pathname.match(/^\/games\/([^/]+)\/?$/) || [])[1]
        var colours = {
          drawfight: '#fbfaf3',
          drawpets: '#fbf6ea',
          'wizard-survivors': '#05070c',
          'wizard-wars': '#1b1240',
        }
        document.documentElement.style.backgroundColor = colours[game] || '#020618'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
