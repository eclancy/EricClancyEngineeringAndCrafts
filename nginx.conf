server {
    listen 80;
    server_name ecec.dev www.ecec.dev;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Short link to DrawFight's "Draw Your Fighter" guide, which is hosted as a Claude
    # artifact. 302 rather than 301 so the target can change without browsers caching it.
    location ~ ^/draw/?$ {
        return 302 https://claude.ai/artifact/DmdTZS491FFJs28Cj8g5qL;
    }

    # SPA fallback: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
