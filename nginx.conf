server {
    listen 80;
    server_name ecec.dev www.ecec.dev;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Short link to DrawFight's "Draw Your Fighter" guide, which is hosted as a Claude
    # artifact. Not an HTTP redirect: a small page (public/draw/index.html) that carries its
    # own link-preview tags and image, then sends people on. Chat apps follow a 302 to the
    # artifact and show its preview instead; they read this page's tags and stop.
    # /drawfight is the link to share; /draw is kept because it was shared first.
        try_files /draw/index.html =404;
    }

    # 11 Forest View Drive -- the house itself: deal terms, condition, key dates.
    location ~ ^/house/?$ {
        return 302 https://claude.ai/artifact/FWhCzraQtx5w3VHBs5atfb;
    }

    # Renovation working folder -- costs, contractor leads, move-in measurement list.
    location ~ ^/reno/?$ {
        return 302 https://claude.ai/artifact/GeJ5a9qmE1HHMMvQBSgfbv;
    }

    # The four projects, shareable summary version. Deliberately not /projects --
    # the site's own Projects section owns that word, and #projects anchors to it.
    location ~ ^/our-projects/?$ {
        return 302 https://claude.ai/artifact/PRd1aXCdGXoakQxau5DnS8;
    }

    # Mortgage document checklist.
    location ~ ^/checklist/?$ {
        return 302 https://claude.ai/artifact/LSk4LfszEdW7fje4J7CK8U;
    }

    # SPA fallback: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
