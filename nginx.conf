server {
    listen 80;
    server_name ecec.dev www.ecec.dev;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Short link to DrawFight's "Draw Your Fighter" guide, which is hosted as a Claude
    # artifact. Not an HTTP redirect: a small page (public/draw/index.html) that carries its
    # own link-preview tags and image, then sends people on. Chat apps follow a 302 to the
    # artifact and show its preview instead; they read this page's tags and stop.
    # /drawfight is the link to share; /draw is kept because it was shared first.
    location ~ ^/(drawfight|draw)/?$ {
        try_files /draw/index.html =404;
    }

    # The 11 Forest View Drive short links, same idea. Pages rather than redirects
    # because a redirect has no preview: an unfurler following one would read the
    # target's tags, and these targets are private artifacts, so what it would
    # unfurl is a permission wall.
    #
    #   /house         deal terms, condition, key dates
    #   /reno          renovation working folder
    #   /our-projects  the four projects, shareable version. Deliberately not
    #                  /projects: the site's own Projects section owns that word
    #   /checklist     mortgage document checklist
    #
    # The artifact URLs are safe in a public repo -- without access they resolve
    # to that permission wall. They are not access tokens.
    #
    # Generated by scripts/build-short-links.mjs. Matched explicitly rather than
    # left to the SPA fallback so /house and /house/ both serve the page with no
    # trailing-slash 301 sitting in front of the unfurler. Separate block from
    # /draw above because that one maps two paths onto one directory, while these
    # each have their own.
    location ~ ^/(house|reno|our-projects|checklist)/?$ {
        try_files /$1/index.html =404;
    }

    # SPA fallback: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
