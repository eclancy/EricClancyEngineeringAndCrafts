# Cheap insurance for the game download paths: 10 requests a second per visitor. Keyed on
# X-Real-IP because every request reaches this container from the host's nginx, so the
# connection address is the same for everyone.
limit_req_zone $http_x_real_ip zone=games:1m rate=10r/s;
limit_req_status 429;
# DrawPets' meeting point: a swap is a handful of short requests, most of them waiting.
limit_req_zone $http_x_real_ip zone=meet:1m rate=5r/s;
# Update-email sign-ups: a person signs up once; anything faster is a script.
limit_req_zone $http_x_real_ip zone=updates:1m rate=6r/m;

# Each downloadable game's update check, mapped to the eclancy/<repo> whose newest GitHub Release
# answers it. A new game is a line here, its id in the two locations below, a download page in
# public/<id>/download/, a `game` entry in src/data/projects.ts, a line in updates/server.js,
# and its share tags in scripts/game-pages.ts.
map $uri $game_repo {
    /drawfight/version.json        DrawFight;
    /wizard-survivors/version.json WizardSurvivors;
    /wizard-wars/version.json      WizardWars;
    /drawpets/version.json         DrawPets;
}

# www.ecec.dev is the same site, so it sends visitors (and search engines) to ecec.dev rather
# than serving a second copy that would split the site's search ranking between two addresses.
# The host's nginx terminates TLS for both and passes the Host header through.
server {
    listen 80;
    server_name www.ecec.dev;
    include /etc/nginx/security-headers.conf;
    return 301 https://ecec.dev$request_uri;
}

server {
    listen 80 default_server;
    server_name ecec.dev;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain
               text/xml application/xml application/manifest+json;
    gzip_min_length 1024;
    gzip_comp_level 6;  # nginx's default of 1 left the main script at 87 KB; 6 gets ~75 KB
    gzip_vary on;
    # Every request arrives through the host's nginx, and gzip skips proxied requests unless
    # told - without these the site's own scripts and styles went out uncompressed.
    gzip_proxied any;
    gzip_http_version 1.0;  # the host's nginx forwards as HTTP/1.0

    # HTTPS-only, no MIME sniffing, no framing by other sites. A location with an add_header
    # of its own drops these, so each of those includes the file again.
    include /etc/nginx/security-headers.conf;

    # Anything with nothing at its address gets the site's own "Page not found" page
    # (public/404.html), with a real 404 status so search engines don't index it.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Google Analytics (public/analytics.js), loaded by every page. Its name never changes, so
    # it's checked on every load, not cached for a month like the build's hashed scripts.
    location = /analytics.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # The game pages' looping clips (public/games/<id>/clips). Their names don't change when
    # a clip is re-recorded, so a week and no "immutable", unlike the hashed build assets.
    location ~* \.(?:mp4|webm)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # DrawFight's fighter submission form (public/draw/index.html), which also carries the
    # link-preview tags and image for sharing. It links on to the "Draw Your Fighter" guide.
    # /drawfight is the link to share; /draw is kept because it was shared first.
    location ~ ^/(drawfight|draw)/?$ {
        try_files /draw/index.html =404;
    }

    # The DrawFight drawing guide, hosted here so kids are sent a page on ecec.dev.
    location ~ ^/draw/guide/?$ {
        try_files /draw/guide/index.html =404;
    }

    # Each game's download page. The download itself is a GitHub Release, which GitHub serves
    # free and without a bandwidth cap, so a bot fetching it in a loop costs nothing here.
    location ~ ^/(drawfight|wizard-survivors|wizard-wars|drawpets)/download/?$ {
        limit_req zone=games burst=20 nodelay;
        try_files /$1/download/index.html =404;
    }

    # Every downloaded copy of a game checks its version.json on start to find out whether it
    # is out of date. It redirects to the newest release's version.json on GitHub, so a release
    # needs no deploy here - and because this address is the one baked into every copy, releases
    # can move later without stranding them. See .ai/releasing.md in each game's repo.
    location ~ ^/(drawfight|wizard-survivors|wizard-wars|drawpets)/version\.json$ {
        limit_req zone=games burst=20 nodelay;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        return 302 https://github.com/eclancy/$game_repo/releases/latest/download/version.json;
    }

    # The game pages, /games/<id>, are rendered by the React app. Each has its own copy of
    # index.html carrying the game's title and link-preview tags, written by the build
    # (scripts/game-pages.ts) into the folder that also holds the page's clips and art. A game
    # with no copy is not a game page, so it gets the 404.
    location ~ ^/games/([^/]+)/?$ {
        try_files /games/$1/index.html =404;
    }

    # The 11 Forest View Drive short links, same idea. Pages rather than redirects
    # because a redirect has no preview: an unfurler following one would read the
    # target's tags, and these targets are private artifacts, so what it would
    # unfurl is a permission wall.
    #
    #   /house         deal terms, condition, key dates
    #   /reno          renovation working folder
    #   /our-projects  the four projects, shareable version. Deliberately not
    #                  /projects: the site's own Projects section owns that word
    #   /checklist     mortgage document checklist
    #
    # The artifact URLs are safe in a public repo -- without access they resolve
    # to that permission wall. They are not access tokens.
    #
    # Generated by scripts/build-short-links.mjs. Matched explicitly rather than
    # left to the catch-all location so /house and /house/ both serve the page with no
    # trailing-slash 301 sitting in front of the unfurler. Separate block from
    # /draw above because that one maps two paths onto one directory, while these
    # each have their own.
    location ~ ^/(house|reno|our-projects|checklist)/?$ {
        try_files /$1/index.html =404;
    }

    # Fighter submissions from the /draw form, handed to the intake container. Photos are
    # shrunk in the browser before sending, so this limit is a backstop.
    location /api/draw {
        client_max_body_size 60m;
        proxy_pass http://intake:3000;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_read_timeout 120s;
    }

    # DrawPets in the browser (fetched from DrawPets' GitHub Release by deploy.yml). ^~ keeps the
    # long-cache rule for images and scripts above away from it: the game's files keep the same
    # names from one release to the next, so they must be checked every time, or a visitor could
    # get last release's engine with this release's game.
    location = /drawpets/play {
        return 301 /drawpets/play/;
    }
    location ^~ /drawpets/play/ {
        limit_req zone=games burst=40 nodelay;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        gzip_types application/wasm application/octet-stream application/javascript application/json;
        types {
            text/html html;
            application/javascript js;
            application/wasm wasm;
            application/octet-stream pck;
            application/json json;
            image/png png;
            text/plain txt;
        }
        try_files $uri $uri/index.html =404;
    }

    # DrawPets' meeting point (meet/server.js): two devices swapping pets side by side pass the
    # few short notes WebRTC needs to connect them directly. Nothing is logged here either - a
    # room name in an access log would outlive the room.
    location /api/meet/ {
        limit_req zone=meet burst=30 nodelay;
        client_max_body_size 16k;
        access_log off;
        proxy_pass http://meet:3001;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_read_timeout 40s;
        proxy_buffering off;
    }

    # Game update emails (updates/server.js): sign-ups from the game pages, and the confirm and
    # unsubscribe links in the emails. Not logged: those links carry each subscriber's token.
    location /api/updates/ {
        limit_req zone=updates burst=10 nodelay;
        client_max_body_size 4k;
        access_log off;
        proxy_pass http://updates:3002;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_read_timeout 30s;
    }

    # Files as they are, a folder's index.html, and otherwise the 404 page. The app is one page
    # (/) plus the game pages above, so there are no other routes to fall back to index.html.
    location / {
        try_files $uri $uri/index.html =404;
    }
}
