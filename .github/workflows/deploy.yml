name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync app to droplet
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .git \
            ./ "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/opt/ecec-hub/"

      - name: Rebuild and restart container
        run: |
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd /opt/ecec-hub && docker compose up -d --build"

      - name: Verify deploy
        run: |
          # `docker compose up -d` returns once the container has started, not
          # once nginx inside it is serving, so poll instead of curling
          # immediately -- a bare curl races the container and gets a 502.
          url="https://${{ secrets.DROPLET_HOST_NAME }}"
          for attempt in $(seq 1 15); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "$url -> $code (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: got $code, retrying in 4s"
            sleep 4
          done
          echo "::error::$url did not return 200 after 15 attempts (last: $code)"
          exit 1
