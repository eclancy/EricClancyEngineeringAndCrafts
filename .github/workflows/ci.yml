name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # The deploy restarts nginx with this config and nothing checks it first, so a typo would
      # take the site down. Same image as the Dockerfile; intake is the compose service it
      # proxies to, which nginx resolves on start.
      - name: Check nginx.conf
        run: >
          docker run --rm --add-host intake:127.0.0.1 --add-host meet:127.0.0.1
          --add-host updates:127.0.0.1
          -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/nginx-security-headers.conf:/etc/nginx/security-headers.conf:ro"
          nginx:1.30-alpine nginx -t
