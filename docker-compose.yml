services:
  web:
    build: .
    image: ecec-hub:latest
    container_name: ecec-hub
    restart: unless-stopped
    depends_on:
      - intake
      - meet
    ports:
      # Bound to localhost only — host Nginx + certbot reverse-proxies and terminates TLS.
      - '127.0.0.1:8080:80'

  # DrawPets' meeting point (meet/server.js): introduces two devices whose kids are swapping pets
  # side by side, then steps away. Keeps nothing - no volume, no logs of rooms or addresses.
  # Only reachable through the web container's nginx (/api/meet).
  meet:
    build: ./meet
    image: ecec-meet:latest
    container_name: ecec-meet
    restart: unless-stopped

  # Receives DrawFight fighter submissions from ecec.dev/draw. Only reachable through the web
  # container's nginx (/api/draw), never published on a port of its own.
  intake:
    build: ./intake
    image: ecec-intake:latest
    container_name: ecec-intake
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    # RESEND_API_KEY lives only on the server, in this file (not in the repo). Without it,
    # submissions are still saved; they just are not emailed. MAIL_TO, where they are emailed,
    # is set there too (server.js falls back to eric@ecec.dev) - set here, it would override it.
    env_file:
      - path: /etc/ecec/intake.env
        required: false
    volumes:
      # Outside /opt/ecec-hub, which every deploy rsyncs over with --delete.
      - /var/lib/drawfight-submissions:/data
